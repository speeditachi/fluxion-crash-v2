
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080c">
  <title>FLUXION | Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">☠ FLUXION.</a>
  <div class="status"><span></span> SYSTEM ONLINE</div>
</header>

<main>
  <section class="hero">
    <div class="symbol">⚡</div>
    <h1>FLUXION <span>ACCOUNT</span></h1>
    <p>Manage your personal profile.</p>
  </section>

  <section class="card">
    <h2>YOUR PROFILE</h2>

    <label for="username">USERNAME</label>
    <input id="username" type="text" placeholder="Enter username">

    <label for="email">EMAIL</label>
    <input id="email" type="email" placeholder="Enter email">

    <button id="saveBtn">SAVE PROFILE →</button>

    <p id="accountMessage" class="message">
      Your profile is not saved yet.
    </p>
  </section>

  <section class="card">
    <h2>ACCOUNT SECURITY</h2>
    <p>Never share your passwords, verification codes, or WhatsApp session credentials.</p>
  </section>
</main>

<footer>
  <strong>☠ FLUXION CRASH V2</strong>
  <p>POWERED BY SPEED ITACHI</p>
  <a href="index.html">← BACK HOME</a>
</footer>

<script>
const username = document.getElementById("username");
const email = document.getElementById("email");
const saveBtn = document.getElementById("saveBtn");
const accountMessage = document.getElementById("accountMessage");

saveBtn.addEventListener("click", () => {
  const name = username.value.trim();
  const mail = email.value.trim();

  if (!name || !mail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) {
    accountMessage.textContent = "Enter a valid username and email.";
    return;
  }

  accountMessage.textContent =
    "Profile details checked. Secure account storage is not configured yet.";
});
</script>

</body>
</html>
