<!-- QR CODE + PAIRING CODE -->
<div id="result-box" class="result-panel">
    <div class="success-title">
        <span>✓</span> CONNECTION CODE GENERATED
    </div>
    <div id="qr-container">
        <div id="qrcode"></div>
        <p>SCAN WITH WHATSAPP</p>
    </div>
    <div class="code-label">YOUR PAIRING CODE</div>
    <div id="pairing-code">--------</div>
    <div class="result-actions">
        <button id="copy-btn" class="copy-button">
            ▣ COPY CODE
        </button>
        <button id="download-qr" class="download-button">
            ↓ DOWNLOAD QR
        </button>
    </div>
    <p id="copy-message"></p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let qrInstance = null;
function displayConnection(data) {
    const result = document.getElementById("result-box");
    const code = document.getElementById("pairing-code");
    const qr = document.getElementById("qrcode");
    result.style.display = "block";
    code.textContent = data.code || "NOT AVAILABLE";
    qr.innerHTML = "";
    if (data.qr && window.QRCode) {
        qrInstance = new QRCode(qr, {
            text: data.qr,
            width: 190,
            height: 190,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });
    } else {
        qr.textContent = "QR NOT PROVIDED BY SERVER";
    }
}
document.getElementById("copy-btn")
.addEventListener("click", async () => {
    const code = document.getElementById("pairing-code").textContent;
    try {
        await navigator.clipboard.writeText(code);
        const btn = document.getElementById("copy-btn");
        btn.textContent = "✓ COPIED SUCCESSFULLY";
        document.getElementById("copy-message").textContent =
            "Your code has been copied!";
        setTimeout(() => {
            btn.textContent = "▣ COPY CODE";
        }, 2000);
    } catch {
        alert("Unable to copy. Please copy manually: " + code);
    }
});
document.getElementById("download-qr")
.addEventListener("click", () => {
    const canvas = document.querySelector("#qrcode canvas");
    const image = document.querySelector("#qrcode img");
    const source = canvas ? canvas.toDataURL("image/png")
                         : image ? image.src : null;
    if (!source) {
        alert("No QR code available.");
        return;
    }
    const link = document.createElement("a");
    link.href = source;
    link.download = "FLUXION-QR.png";
    link.click();
});
</script>
